version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dars-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dars
      POSTGRES_PASSWORD: dars_password
      POSTGRES_DB: dars_dev
    ports:
      - '5432:5432'
    volumes:
      - dars_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dars -d dars_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: dars-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  dars_postgres_data:
