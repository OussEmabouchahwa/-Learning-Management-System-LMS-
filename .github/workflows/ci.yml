name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dars_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build --workspace=packages/contracts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/dars_test?schema=public
        run: |
          cd apps/api
          npx prisma migrate deploy

      - name: Test API
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/dars_test?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-32-chars
        run: npm run test:e2e --workspace=apps/api

      - name: Test Web
        run: npm run test --workspace=apps/web

      - name: Build Web Application
        run: npm run build --workspace=apps/web

      - name: Build API Application
        run: npm run build --workspace=apps/api
